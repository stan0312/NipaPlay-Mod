name: Build Web (for NAS deployment)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /

      - name: Package zip
        run: |
          cd build
          zip -r ../nipaplay-web.zip web
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nipaplay-web
          path: nipaplay-web.zip
          retention-days: 90
