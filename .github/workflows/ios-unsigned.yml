name: Build iOS Unsigned (TrollStore)

on:
  workflow_dispatch:
  # push 触发暂时关闭：弹幕删除迭代期间用 analyze 验证，全部通过后手动触发打包

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Build-iOS-unsigned:
    name: Build iOS IPA (unsigned)
    uses: ./.github/workflows/build-ios.yml
    with:
      upload-to-app-store: false
